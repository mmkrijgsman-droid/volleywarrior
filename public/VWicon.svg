<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M256 28 L460 100 C460 100 470 280 256 484 C42 280 52 100 52 100 Z"
        fill="url(#shieldGrad)" stroke="url(#rimGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner shield border -->
  <path d="M256 56 L436 118 C436 118 445 274 256 456 C67 274 76 118 76 118 Z"
        fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" opacity="0.5"/>

  <!-- Crossed swords behind volleyball (warrior element) -->
  <g opacity="0.85">
    <!-- Left sword blade -->
    <line x1="150" y1="360" x2="265" y2="120" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <line x1="150" y1="360" x2="265" y2="120" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Left sword guard -->
    <line x1="220" y1="190" x2="245" y2="210" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <!-- Left sword handle -->
    <line x1="150" y1="360" x2="138" y2="380" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>

    <!-- Right sword blade -->
    <line x1="362" y1="360" x2="247" y2="120" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <line x1="362" y1="360" x2="247" y2="120" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Right sword guard -->
    <line x1="292" y1="190" x2="267" y2="210" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <!-- Right sword handle -->
    <line x1="362" y1="360" x2="374" y2="380" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Volleyball circle -->
  <circle cx="256" cy="235" r="110" fill="url(#ballGrad)" stroke="#fef3c7" stroke-width="3"/>

  <!-- Volleyball seam lines -->
  <path d="M146 235 C186 198 230 194 256 235 C282 276 330 272 366 235"
        fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
  <path d="M192 145 C215 190 215 260 192 325"
        fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 145 C297 190 297 260 320 325"
        fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>

  <!-- "VW" text at bottom of shield -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="900" font-size="58" fill="#f8fafc" letter-spacing="4">VW</text>
</svg>
